name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API (lint and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: isla
          POSTGRES_PASSWORD: isla_ci_password
          POSTGRES_DB: isla_blanca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isla -d isla_blanca_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://isla:isla_ci_password@localhost:5432/isla_blanca_test
      TEST_DATABASE_URL: postgresql+psycopg://isla:isla_ci_password@localhost:5432/isla_blanca_test
      JWT_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-hs256
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  frontend:
    name: Site (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t isla-blanca-api backend
      - run: docker build -t isla-blanca-web frontend
