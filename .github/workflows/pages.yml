name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # The site lives at https://<user>.github.io/<repository>/.
      VITE_BASE: /${{ github.event.repository.name }}/
      # Repository variable (Settings → Secrets and variables → Actions → Variables),
      # e.g. https://isla-blanca-api.onrender.com
      VITE_API_URL: ${{ vars.API_URL }}
    steps:
      - name: Check that the API address is set
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Set the API_URL repository variable to the deployed API's address."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # GitHub Pages has no URL rewrites: its 404 page is the app itself, so deep links work.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
