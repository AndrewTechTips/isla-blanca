name: isla-blanca

services:
  db:
    image: postgres:18-alpine
    container_name: isla-blanca-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-isla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isla_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-isla_blanca}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
