# Serves the built single-page app and forwards /api to the API container, so the browser
# talks to one origin (no CORS) exactly like the Vite dev server does.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File names in /assets contain a content hash, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Any other path is a page of the app: let React Router handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
