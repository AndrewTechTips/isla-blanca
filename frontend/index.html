<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Isla Blanca · Luxury Resort & Spa in Ibiza</title>
    <meta
      name="description"
      content="Suites and private villas above the Mediterranean in Ibiza. Book your stay at Isla Blanca."
    />
    <meta name="theme-color" content="#1e2a24" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts are served with the site (no third-party origins) and requested by the app right
         after its first frame (lib/fonts.ts), so they never compete with it for the first paint.
         Until they arrive, local fonts resized to the same metrics stand in (styles/index.css). -->
    <noscript><link rel="stylesheet" href="/fonts/fonts.css" /></noscript>

    <!-- The home page opens on a full-screen photo: start fetching it before the app has loaded.
         Same candidates as its srcset (src/lib/images.ts), so it is never downloaded twice. Other
         pages open on something else, so they don't spend the bandwidth. -->
    <script>
      if (location.pathname === '%BASE_URL%') {
        const hero = '%BASE_URL%images/home/hero'
        const link = document.createElement('link')
        link.rel = 'preload'
        link.as = 'image'
        link.fetchPriority = 'high'
        link.imageSizes = '100vw'
        link.imageSrcset = [400, 800, 1200, 1600].map((w) => `${hero}-${w}.webp ${w}w`).join(', ')
        document.head.append(link)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
